name: Setup custom LLVM 15 on Windows
description: Restore or download the repository's verified LLVM 15 Windows toolchain

inputs:
  download-url:
    description: GitHub release asset URL
    required: false
    default: https://github.com/Microindole/lency/releases/download/llvm-15.0.7-custom-v1/llvm-15.0.7-custom-windows-x86_64-msvc-x86only.zip
  sha256:
    description: Expected SHA-256 published by the GitHub release asset API
    required: false
    default: 55c41fa0ad97afc806d0438e6310243e13d6513a9c7b5c7546d6893f0d714d2a

runs:
  using: composite
  steps:
    - name: Restore LLVM toolchain cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}\llvm-15.0.7-custom
        key: llvm-15.0.7-custom-windows-x64-${{ inputs.sha256 }}

    - name: Download and verify LLVM toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP "llvm-15.0.7-custom.zip"
        $prefix = Join-Path '${{ runner.tool_cache }}' "llvm-15.0.7-custom"

        Invoke-WebRequest -Uri '${{ inputs.download-url }}' -OutFile $archive
        $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        $expected = '${{ inputs.sha256 }}'.ToLowerInvariant()
        if ($actual -ne $expected) {
          throw "LLVM archive SHA-256 mismatch: expected $expected, got $actual"
        }

        New-Item -ItemType Directory -Path $prefix -Force | Out-Null
        Expand-Archive -LiteralPath $archive -DestinationPath $prefix -Force

    - name: Configure LLVM environment
      shell: pwsh
      run: |
        $prefix = Join-Path '${{ runner.tool_cache }}' "llvm-15.0.7-custom"
        .\scripts\win\setup-dev.ps1 -LlvmPrefix $prefix
        "LLVM_SYS_150_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
