name: Tests

on:
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "editors/**"
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: ["main", "dev"]
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "editors/**"
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Scope
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      compiler: ${{ steps.filter.outputs.compiler }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'xtask/**'
              - 'tests/integration/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'scripts/**'
              - '.github/actions/**'
              - '.github/workflows/tests.yml'
            compiler:
              - 'crates/**'
              - 'xtask/**'
              - 'lencyc/**'
              - 'lib/**'
              - 'tests/integration/**'
              - 'tests/example/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'scripts/**'
              - '.github/actions/**'
              - '.github/workflows/tests.yml'
      - name: Scope Summary
        run: |
          {
            echo "### CI Scope"
            echo "- workflow: tests.yml"
            echo "- rust: ${{ steps.filter.outputs.rust }}"
            echo "- compiler: ${{ steps.filter.outputs.compiler }}"
          } >> "$GITHUB_STEP_SUMMARY"

  rust-checks:
    name: Rust Checks (Linux x64)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_150_PREFIX: /usr/lib/llvm-15
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 15
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-15-dev libpolly-15-dev libz-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust workflow
        run: bash scripts/linux/run_checks.sh

  lency-linux:
    name: Lency Checks (Linux ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.compiler == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      LLVM_SYS_150_PREFIX: /usr/lib/llvm-15
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 15
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-15-dev libpolly-15-dev libz-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Lency workflow
        run: bash scripts/linux/run_lency_checks.sh

  lency-macos:
    name: Lency Checks (macOS arm64)
    needs: changes
    if: needs.changes.outputs.compiler == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      RUSTFLAGS: -C symbol-mangling-version=v0
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 15
        run: |
          brew install llvm@15
          LLVM_PREFIX="$(brew --prefix llvm@15)"
          echo "LLVM_SYS_150_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust unit tests
        run: cargo test --workspace --verbose
      - name: Run Lency workflow
        run: bash scripts/linux/run_lency_checks.sh

  lency-windows:
    name: Lency Checks (Windows x64)
    needs: changes
    if: needs.changes.outputs.compiler == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-llvm-15-windows
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust unit tests
        shell: pwsh
        run: cargo test --workspace --verbose
      - name: Run Lency workflow
        shell: pwsh
        run: .\scripts\win\run_lency_checks.ps1
